name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: fixtures/input
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Fetch fixtures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fixtures.js fetch

      - name: Verify fixtures
        run: node scripts/fixtures.js verify

      - name: Syntax gate and unit tests
        run: npm test

      - name: Golden regression (deterministic engine)
        if: matrix.node == '20'
        run: npm run test:e2e

      # A result that does not compile is not a result. The second step is a
      # report, not a gate yet: two register reads in Lph6 are still unresolved
      # (see TECHNICAL §3), and hiding them would be worse than showing them.
      - name: Result compiles in Luau
        if: matrix.node == '20'
        run: node scripts/luac.js results/*.luau --verbose

      - name: Unresolved register reads (report)
        if: matrix.node == '20'
        run: node scripts/freevars.js results/*.luau --report-only
