# The engine's own settings (src/format.js mirrors these values). Kept here so an
# editor or a `stylua` on PATH formats a result the same way the engine does.
syntax = "All"
column_width = 100
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
space_after_function_names = "Never"
